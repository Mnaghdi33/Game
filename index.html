<div id="ui" style="position:absolute; top:20px; left:20px; font-family:'Courier New', monospace; color:white; z-index:10; pointer-events:none;">
    <div style="font-size:30px; font-weight:bold; text-shadow: 0 0 10px #0ff;">SCORE: <span id="scoreVal">0</span></div>
    <div id="levelText" style="font-size:16px; color:#0f0;">LEVEL: 1</div>
</div>
<canvas id="gameCanvas" style="display:block; background:#000;"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("scoreVal");
    const levelEl = document.getElementById("levelText");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let level = 1;
    let gameOver = false;
    let enemies = [];
    let particles = [];

    let player = { x: canvas.width/2, y: canvas.height/2, radius: 12, color: '#00f2ff' };

    // کلاس دشمن
    class Enemy {
        constructor(speed) {
            this.radius = 15 + Math.random() * 10;
            this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
            this.speed = speed;
            // شروع از خارج صفحه
            if (Math.random() < 0.5) {
                this.x = Math.random() < 0.5 ? -this.radius : canvas.width + this.radius;
                this.y = Math.random() * canvas.height;
            } else {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() < 0.5 ? -this.radius : canvas.height + this.radius;
            }
        }
        update() {
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            this.x += (dx/dist) * this.speed;
            this.y += (dy/dist) * this.speed;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.closePath();
        }
    }

    // کلاس ذرات (برای انفجار)
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.size = Math.random() * 3;
            this.speedX = (Math.random() - 0.5) * 5;
            this.speedY = (Math.random() - 0.5) * 5;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    window.addEventListener("touchmove", (e) => {
        e.preventDefault();
        player.x = e.touches[0].clientX;
        player.y = e.touches[0].clientY;
    }, {passive: false});

    window.addEventListener("mousemove", (e) => {
        player.x = e.clientX;
        player.y = e.clientY;
    });

    function spawnEnemy() {
        if(!gameOver) {
            enemies.push(new Enemy(2 + level * 0.5));
            setTimeout(spawnEnemy, Math.max(200, 2000 - (level * 200)));
        }
    }

    function animate() {
        if (gameOver) return;

        ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; // افکت تاریک شدن دنباله
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // رسم بازیکن
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.fill();
        ctx.closePath();

        // مدیریت دشمن‌ها
        enemies.forEach((enemy, index) => {
            enemy.update();
            enemy.draw();

            // برخورد با بازیکن
            let dx = player.x - enemy.x;
            let dy = player.y - enemy.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < player.radius + enemy.radius) {
                gameOver = true;
                // انفجار هنگام باخت
                for(let i=0; i<30; i++) particles.push(new Particle(player.x, player.y, player.color));
                alert("GAME OVER! SCORE: " + Math.floor(score));
                location.reload();
            }
        });

        // مدیریت ذرات
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if(p.life <= 0) particles.splice(i, 1);
        });

        // امتیاز و لول
        score += 0.05;
        scoreEl.innerText = Math.floor(score);
        let newLevel = Math.floor(score / 100) + 1;
        if(newLevel > level) {
            level = newLevel;
            levelEl.innerText = "LEVEL: " + level;
        }

        requestAnimationFrame(animate);
    }

    spawnEnemy();
    animate();
</script>
